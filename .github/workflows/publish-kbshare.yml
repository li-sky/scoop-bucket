name: Publish kbshare
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Upstream Rust branch, tag or commit'
        default: v2
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: publish-kbshare
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: li-sky/ununifying_kboard_share
          ref: ${{ inputs.source_ref }}
          path: upstream
          persist-credentials: false
      - name: Identify source and package version
        id: metadata
        run: |
          $sha = git -C upstream rev-parse HEAD
          $version = python -c "import tomllib; print(tomllib.load(open('upstream/Cargo.toml', 'rb'))['workspace']['package']['version'])"
          if ($LASTEXITCODE) { throw 'Cannot read upstream version' }
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "version=$version.${{ github.run_number }}" >> $env:GITHUB_OUTPUT
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup target add x86_64-pc-windows-msvc
      - name: Build Windows binaries
        working-directory: upstream
        run: |
          cargo build --locked --release --target x86_64-pc-windows-msvc -p kbshare -p kbshare-tray --bins
          if ($LASTEXITCODE) { throw 'Windows build failed' }
      - name: Package and hash
        run: ./scripts/package.ps1 -Version '${{ steps.metadata.outputs.version }}' -SourceSha '${{ steps.metadata.outputs.sha }}'
      - name: Validate manifest and Scoop install
        run: ./scripts/test-install.ps1 -Version '${{ steps.metadata.outputs.version }}'
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
          SOURCE_SHA: ${{ steps.metadata.outputs.sha }}
        run: |
          @"
          Windows x64 build of kbshare (Rust v2).

          Source: https://github.com/li-sky/ununifying_kboard_share/commit/$env:SOURCE_SHA
          Target: x86_64-pc-windows-msvc, statically linked C runtime.
          Package contains kbshare.exe, kbshare-config.exe and Scoop launchers.
          Verified with Scoop installation and persistence checks on Windows.
          "@ | Set-Content dist/release-notes.md -Encoding utf8
          gh release create "kbshare-v$env:VERSION" "dist/kbshare-$env:VERSION-windows-x64.zip" "dist/kbshare-$env:VERSION-windows-x64.zip.sha256" --title "kbshare $env:VERSION (Windows x64)" --notes-file dist/release-notes.md --latest
          if ($LASTEXITCODE) { throw 'Release publishing failed' }
      - name: Update bucket manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket/kbshare.json
          git commit -m 'kbshare: update to ${{ steps.metadata.outputs.version }}'
          if ($LASTEXITCODE) { throw 'Manifest commit failed' }
          git push origin HEAD:main
          if ($LASTEXITCODE) { throw 'Manifest push failed' }
